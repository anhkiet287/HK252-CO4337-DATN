experiment:
  platform: colab
  seed: 42
  device: cuda
  precision: fp32
  deterministic: true

dataset:
  name: cifar10
  data_dir: /content/drive/MyDrive/ardg/data
  val_ratio: 0.02
  num_workers: 4
  augmentation: standard
  max_train_samples: 512
  max_val_samples: 128
  max_test_samples: 128

model:
  name: resnet50_cifar
  num_classes: 10

train:
  mode: erm
  epochs: 2
  batch_size: 64
  max_batches: 8
  max_val_batches: 4
  log_interval: 1
  early_stopping:
    enabled: false
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 2
    eta_min: 0.0

attack:
  val_suite:
    - label: clean
      type: clean
    - label: pgd5
      type: pgd
      eps: 0.0313725
      step_size: 0.007843
      num_steps: 5
      restarts: 1
      random_start: true
  eval_suite:
    enabled: false

logging:
  wandb:
    enabled: false
    project: ardg
    entity: ""
  run_name: smoke_resnet50_colab_erm
