experiment:
  seed: 42
  device: cuda
  precision: fp32
  deterministic: true
  platform: local

dataset:
  name: cifar10
  data_dir: data
  val_ratio: 0.02
  num_workers: 4

model:
  name: resnet18_cifar
  num_classes: 10

train:
  mode: erm
  epochs: 1
  batch_size: 128
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 1
    eta_min: 0.0

attack:
  eval_suite:
    enabled: true
    max_batches: 0
    attacks:
      - label: pgd20
        type: pgd
        eps: 0.0313725
        step_size: 0.007843
        num_steps: 20
        restarts: 5
      - label: autoattack
        type: autoattack
        eps: 0.0313725
        norm: Linf
        version: standard
        n_classes: 10
        verbose: false

logging:
  wandb:
    enabled: true
    project: ardg
    entity: ""
  run_name: cifar10_stage1_eval
  output_dir: outputs
