experiment:
  seed: 42
  device: cuda
  deterministic: true
dataset:
  name: cifar10
  data_dir: data
  val_ratio: 0.02
model:
  name: resnet18_cifar
  num_classes: 10
train:
  mode: groupdro
  epochs: 100
  batch_size: 128
  log_interval: 50
  adv_training: true
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 100
    eta_min: 0.0
  groupdro:
    eta: 0.02
attack:
  train:
    name: pgd
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 7
logging:
  wandb:
    enabled: true
    project: ardg
    entity: ''
  run_name: resnet18_groupdro
  output_dir: /content/drive/MyDrive/ardg/HK252-CO4337-DATN/outputs
