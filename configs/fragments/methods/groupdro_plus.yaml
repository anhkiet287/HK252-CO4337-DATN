train:
  mode: groupdro_plus
  adv_training: true
  epochs: 100
  log_interval: 50
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 100
    eta_min: 0.0
  groupdro:
    eta: 0.02
  groupdro_plus:
    num_clusters: 4
    eta: 0.02
    lambda_reg: 0.5
    gamma: 1.0
