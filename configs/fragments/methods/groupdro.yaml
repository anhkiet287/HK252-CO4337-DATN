train:
  mode: groupdro
  epochs: 50
  log_interval: 50
  selection:
    vector: ["val/acc_worst", "val/acc_avg"]
    eps: 1e-6
  early_stopping:
    enabled: false
    metric: val/acc_worst
    mode: max
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: multistep
    milestones: [10, 20, 30, 40]
    gamma: 0.1
  groupdro:
    update_mode: online
    eta_q: 0.001
    selection_metric: val/acc_worst
    logging:
      plot_q_trajectory: true
      plot_every_epochs: 1
      max_plot_points: 2000
