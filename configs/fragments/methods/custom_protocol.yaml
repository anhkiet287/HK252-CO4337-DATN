train:
  mode: custom_protocol
  adv_training: false
  epochs: 100
  log_interval: 50
  selection:
    vector: val/acc_clean
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 100
    eta_min: 0.0
  custom_protocol:
    # TODO: set to true if your method should train on attacked inputs.
    use_adv_inputs: false
    # TODO: replace these placeholder weights with your real objective hyperparameters.
    weight_main: 1.0
    weight_aux: 0.0
