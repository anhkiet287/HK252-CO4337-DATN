train:
  mode: custom_protocol
  epochs: 100
  log_interval: 50
  selection:
    vector: ["val/acc_worst", "val/acc_avg", "val/acc_clean"]
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 100
    eta_min: 0.0

custom_protocol:
  name: checkpoint_base
  period_epochs: 2
  refresh_subset_size: 0.05
  score_metric: ce_loss
  update_rule:
    temperature: 1.0
    alpha: 0.5
    beta: 0.1
  allocation:
    mode: quota
    one_attack_per_sample: true
  cache:
    save_to_disk: true
    directory: artifacts/checkpoint_base_cache
