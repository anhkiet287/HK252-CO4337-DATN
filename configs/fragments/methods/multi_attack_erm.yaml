train:
  mode: multi_attack_erm
  epochs: 100
  log_interval: 50
  early_stopping:
    enabled: false
  multi_attack:
    strategy: per_batch
    include_clean: true
    aggregation: mean
    checkpoint_metric: pgd20_probe_acc
    checkpoint_tiebreakers: [worst_acc, clean_acc]
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 100
    eta_min: 0.0
