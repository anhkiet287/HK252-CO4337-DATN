experiment:
  seed: 42
  device: "cuda"
  precision: "fp32"

dataset:
  name: "color-mnist"
  data_dir: "data"
  val_ratio: 0.1
  num_workers: 4

model:
  name: "resnet18_cifar"
  num_classes: 10

train:
  mode: "erm"
  epochs: 40
  batch_size: 128
  optimizer:
    name: "sgd"
    lr: 0.05
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: "multistep"
    milestones: [25, 35]
    gamma: 0.1

attack:
  train:
    name: "pgd"
    eps: 0.3
    step_size: 0.01
    num_steps: 7
  val:
    name: "pgd"
    eps: 0.3
    step_size: 0.01
    num_steps: 20
  eval:
    enabled: false
    name: "attack_suite"
    eps: 0.3
    step_size: 0.01
    num_steps: 20
  autoattack:
    enabled: false
    eps: 0.3

logging:
  wandb:
    enabled: true
    project: "ardg"
    entity: ""
  run_name: "clean_color_mnist_resnet18"
  output_dir: "outputs"
