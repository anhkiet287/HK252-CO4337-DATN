experiment:
  seed: 42
  device: "cpu"
  precision: "fp32"

dataset:
  name: "cifar10"
  data_dir: "data"
  val_ratio: 0.02
  num_workers: 0

model:
  name: "resnet18_cifar"
  num_classes: 10

train:
  mode: "pgd_at"
  epochs: 1
  batch_size: 8
  optimizer:
    name: "sgd"
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: "none"

attack:
  train:
    name: "pgd"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 2
  val:
    name: "pgd"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 2
  eval:
    name: "attack_suite"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 2
  autoattack:
    enabled: false
    eps: 0.0313725

logging:
  wandb:
    enabled: true
    project: "ardg"
    entity: ""
  run_name: "cifar10_test"
  output_dir: "outputs"