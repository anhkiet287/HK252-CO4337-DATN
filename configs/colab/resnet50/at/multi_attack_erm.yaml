experiment:
  seed: 42
  device: cuda
  precision: fp32
  deterministic: true

dataset:
  name: cifar10
  data_dir: /content/ardg/data
  val_ratio: 0.02
  num_workers: 8
  augmentation: standard

model:
  name: resnet50_cifar
  num_classes: 10

train:
  mode: multi_attack_erm
  epochs: 100
  batch_size: 64
  log_interval: 50
  early_stopping:
    enabled: false
  multi_attack:
    strategy: all_domains   # mỗi step generate clean + tất cả attack domains
    include_clean: true
    aggregation: mean       # code hiện tại support mean
    checkpoint_metric: pgd20_probe_acc
    checkpoint_tiebreakers: [worst_acc, clean_acc]
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 100
    eta_min: 0.0

attack:
  multi_train:
    norm: Linf
    eps: 0.0313725
    domains:
      - name: clean
        type: clean
      - name: fgsm_rs
        type: fgsm
        alpha: 0.0313725
        random_start: true
      - name: pgd_ce
        type: pgd
        steps: 10
        alpha: 0.007843
        loss: ce
        random_start: true
      - name: pgd_dlr
        type: pgd
        steps: 10
        alpha: 0.007843
        loss: dlr
        random_start: true

  val:
    name: pgd
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 20
    restarts: 5

  eval_suite:
    max_batches: 0
    attacks:
      - label: pgd20
        type: pgd
        eps: 0.0313725
        step_size: 0.007843
        num_steps: 20
        restarts: 5
        loss: ce
        random_start: true
      - label: autoattack
        type: autoattack
        norm: Linf
        eps: 0.0313725
        version: standard
        n_classes: 10
        verbose: false

val:
  probe:
    enabled: true
    type: pgd
    norm: Linf
    eps: 0.0313725
    steps: 20
    alpha: 0.007843
    restarts: 1
    max_batches: 10

logging:
  wandb:
    enabled: true
    project: ardg
    entity: ""
    group_template: "{model}/{stage}"
    add_default_tags: true
  run_name: resnet50_colab_multi_attack_erm_all_domains_full
  output_dir: /content/HK252-CO4337-DATN/outputs
