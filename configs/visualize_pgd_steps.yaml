experiment:
  seed: 42
  device: "cuda"
  precision: "fp32"
  deterministic: true
  platform: "local"

dataset:
  name: "cifar10"
  data_dir: "data"
  val_ratio: 0.02
  num_workers: 2

model:
  name: "resnet18_cifar"
  num_classes: 10

train:
  mode: "pgd_at"
  epochs: 1
  batch_size: 64
  optimizer:
    name: "sgd"
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: "none"

attack:
  train:
    name: "pgd"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 10
  val:
    name: "pgd"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 10
  eval:
    enabled: false
    name: "attack_suite"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 10
  autoattack:
    enabled: false
    eps: 0.0313725

logging:
  wandb:
    enabled: true
    project: "ardg"
    entity: ""
  run_name: "visualize_pgd_steps"
  output_dir: "outputs"

visualize:
  layer: "layer4"
  max_batches: 1
  max_samples: 1
  include_clean: true
  output_dir: "outputs/visualize"
  checkpoint: ""
  log_wandb: true
  max_log_images: 1
  projection: "pca"
