experiment:
  seed: 42
  device: cuda
  precision: fp32
  deterministic: true
  platform: local
dataset:
  name: cifar10
  data_dir: data
  val_ratio: 0.02
  num_workers: 4
model:
  name: vit_b16_cifar
  num_classes: 10
train:
  mode: groupdro_plus
  epochs: 2
  batch_size: 128
  log_interval: 20
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 2
    eta_min: 0.0
  groupdro:
    eta: 0.02
  groupdro_plus:
    num_clusters: 4
    eta: 0.02
    lambda_reg: 0.5
    gamma: 1.0
  rex:
    lambda: 1.0
    num_splits: 2
attack:
  train:
    name: pgd
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 7
  val:
    name: pgd
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 20
  eval:
    name: attack_suite
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 20
  autoattack:
    enabled: true
    eps: 0.0313725
logging:
  wandb:
    enabled: true
    project: ardg
    entity: ''
  run_name: vit_b16_cifar_2060
  output_dir: /content/drive/MyDrive/ardg/HK252-CO4337-DATN/outputs
