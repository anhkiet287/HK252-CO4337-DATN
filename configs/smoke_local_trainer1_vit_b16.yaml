experiment:
  seed: 123
  device: "cuda"
  deterministic: true

dataset:
  name: "cifar10"
  data_dir: "data"
  val_ratio: 0.1
  max_train_samples: 256
  max_val_samples: 128

model:
  name: "vit_b16_cifar"
  num_classes: 10
  pretrained: false

train:
  mode: "rex"  # exercises objective-based training path
  epochs: 2
  batch_size: 64
  log_interval: 5
  max_batches: 5
  max_val_batches: 2
  optimizer:
    name: "sgd"
    lr: 0.05
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: "cosine"
    t_max: 2
    eta_min: 0.0
  rex:
    lambda: 1.0
    num_splits: 2

logging:
  wandb:
    enabled: false
    project: "ardg"
    entity: ""
  run_name: "smoke_local_objective_vit_b16"
  output_dir: "outputs/smoke_local"
