experiment:
  seed: 123
  device: "cpu"
  precision: "fp32"

dataset:
  name: "cifar10"
  data_dir: "data"
  val_ratio: 0.1
  num_workers: 0
  max_train_samples: 64
  max_val_samples: 32
  max_test_samples: 32

model:
  name: "resnet18_cifar"
  num_classes: 10

train:
  mode: "erm"
  epochs: 2
  batch_size: 16
  max_batches: 4
  max_val_batches: 2
  log_interval: 1
  optimizer:
    name: "sgd"
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: "none"

logging:
  wandb:
    enabled: true
    project: "ardg"
    entity: ""
  run_name: "smoke_cifar10_resnet18"
  output_dir: "outputs"
