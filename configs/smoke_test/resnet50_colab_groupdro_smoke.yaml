experiment:
  platform: colab
  seed: 42
  device: cuda
  precision: fp32
  deterministic: true

dataset:
  name: cifar10
  data_dir: /content/drive/MyDrive/ardg/data
  val_ratio: 0.02
  num_workers: 4
  augmentation: standard
  max_train_samples: 512
  max_val_samples: 128
  max_test_samples: 128

model:
  name: resnet50_cifar
  num_classes: 10

train:
  mode: groupdro
  domain_strategy: all_domains
  epochs: 2
  batch_size: 64
  max_batches: 8
  max_val_batches: 4
  log_interval: 1
  selection:
    vector: ["val/acc_worst", "val/acc_avg", "val/acc_clean"]
    eps: 1e-6
  early_stopping:
    enabled: false
    metric: val/acc_worst
    mode: max
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 2
    eta_min: 0.0
  groupdro:
    eta_q: 0.02
    include_clean: true
    init_q: uniform
    worst_group_by: acc
    selection_metric: val/acc_worst

attack:
  train_domains:
    - label: clean
      type: clean
    - label: fgsm_rs
      type: fgsm
      eps: 0.0313725
      alpha: 0.0313725
      random_start: true
    - label: pgd_ce
      type: pgd
      eps: 0.0313725
      step_size: 0.007843
      num_steps: 2
      restarts: 1
      loss: ce
      random_start: true
    - label: pgd_dlr
      type: pgd
      eps: 0.0313725
      step_size: 0.007843
      num_steps: 2
      restarts: 1
      loss: dlr
      random_start: true
  val_suite:
    attacks:
      - label: clean
        type: clean
      - label: fgsm_rs
        type: fgsm
        eps: 0.0313725
        alpha: 0.0313725
        random_start: true
      - label: pgd_ce
        type: pgd
        eps: 0.0313725
        step_size: 0.007843
        num_steps: 2
        restarts: 1
        loss: ce
        random_start: true
      - label: pgd_dlr
        type: pgd
        eps: 0.0313725
        step_size: 0.007843
        num_steps: 2
        restarts: 1
        loss: dlr
        random_start: true
  eval_suite:
    attacks:
      - label: clean
        type: clean
      - label: pgd5
        type: pgd
        eps: 0.0313725
        step_size: 0.007843
        num_steps: 5
        restarts: 1
        random_start: true

val:
  probe:
    enabled: true
    type: pgd
    norm: Linf
    eps: 0.0313725
    steps: 5
    alpha: 0.007843
    restarts: 1
    max_batches: 2

logging:
  wandb:
    enabled: false
    project: ardg
    entity: ""
  run_name: smoke_resnet50_colab_groupdro
