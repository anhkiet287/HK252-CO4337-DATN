experiment:
  seed: 123
  device: cpu
  precision: fp32
  deterministic: true
  platform: local

dataset:
  name: cifar10
  data_dir: data
  val_ratio: 0.1
  num_workers: 0
  max_train_samples: 64
  max_val_samples: 32
  max_test_samples: 32

model:
  name: resnet18_cifar
  num_classes: 10

train:
  mode: erm
  epochs: 1
  batch_size: 16
  max_batches: 4
  max_val_batches: 2
  log_interval: 1
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 1
    eta_min: 0.0

logging:
  wandb:
    enabled: false
    project: ardg
    entity: ""
  run_name: smoke_quick_resnet18_erm
  output_dir: outputs/smoke_local
