experiment:
  seed: 42
  device: cuda
  precision: fp16
  deterministic: true
dataset:
  name: cifar10
  data_dir: data
  val_ratio: 0.02
  num_workers: 8
  augmentation: standard
model:
  name: vit_b16_cifar
  num_classes: 10
  pretrained: false
train:
  mode: groupdro_plus
  adv_training: true
  epochs: 100
  batch_size: 256
  log_interval: 50
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    t_max: 100
    eta_min: 0.0
  groupdro:
    eta: 0.02
  groupdro_plus:
    num_clusters: 4
    eta: 0.02
    lambda_reg: 0.5
    gamma: 1.0
attack:
  train:
    name: pgd
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 7
  val:
    name: pgd
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 20
  eval_suite:
    max_batches: 0
    attacks:
      - label: pgd20
        type: pgd
        eps: 0.0313725
        step_size: 0.007843
        num_steps: 20
        restarts: 5
        loss: ce
        random_start: true
      - label: autoattack
        type: autoattack
        norm: Linf
        eps: 0.0313725
        version: standard
        n_classes: 10
        verbose: false
logging:
  wandb:
    enabled: true
    project: ardg
    entity: ''
  run_name: vit_b16_local_groupdro_plus_at
  output_dir: outputs/local
