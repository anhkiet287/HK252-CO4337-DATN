experiment:
  seed: 123
  device: "cuda"
  precision: "fp32"

dataset:
  name: "cifar10"
  data_dir: "data"
  val_ratio: 0.1
  num_workers: 4
  max_train_samples: 128
  max_val_samples: 64
  max_test_samples: 64

model:
  name: "resnet18_cifar"
  num_classes: 10

train:
  mode: "pgd_at"
  epochs: 2
  batch_size: 64
  max_batches: 4
  max_val_batches: 2
  log_interval: 1
  optimizer:
    name: "sgd"
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: "none"

attack:
  train:
    name: "pgd"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 2
  val:
    name: "pgd"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 2
  eval:
    enabled: false
    name: "attack_suite"
    eps: 0.0313725
    step_size: 0.007843
    num_steps: 2
  autoattack:
    enabled: false
    eps: 0.0313725

logging:
  wandb:
    enabled: true
    project: "ardg"
    entity: ""
  run_name: "smoke_cifar10_pgd_at"
  output_dir: "outputs"
